<!DOCTYPE html>
<!-- Stock category window. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Stock</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="page">
  <header class="page__header flex-between">
    <h2 id="category-title">Loading...</h2>
    <button class="btn btn--secondary btn--sm" id="btn-refresh">&#8635;&ensp;Refresh now</button>
  </header>

  <main class="page__body">
    <div class="card-grid" id="card-grid"></div>
  </main>

  <footer class="page__footer">
    <span id="status-text">Initialising...</span>
    <span id="next-refresh" class="text-muted"></span>
  </footer>

  <script src="stock.js"></script>
</body>
</html>
