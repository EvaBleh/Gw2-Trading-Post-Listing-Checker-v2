<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>TP Current Orders</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="page">
  <header class="page__header flex-between">
    <h2>↔ Current Orders</h2>
    <button class="btn btn--secondary btn--sm" id="btn-refresh">↺&ensp;Refresh</button>
  </header>

  <div class="orders__toolbar">
    <fieldset class="orders__filter">
      <legend>Show</legend>
      <label class="orders__filter-option">
        <input type="radio" name="order-type" value="Buy" checked>
        Buy orders
      </label>
      <label class="orders__filter-option">
        <input type="radio" name="order-type" value="Sell">
        Sell orders
      </label>
    </fieldset>
    <div class="orders__summary" id="orders-summary">Loading orders…</div>
  </div>

  <div class="orders__table-wrap">
    <table class="orders-table">
      <thead>
        <tr>
          <th>Type</th>
          <th>Item</th>
          <th class="right">Quantity</th>
          <th class="right">Price</th>
          <th class="right">Total</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody id="orders-body">
        <tr><td colspan="6"><div class="loading-state"><span class="spinner"></span><span>Loading orders…</span></div></td></tr>
      </tbody>
    </table>
  </div>

  <footer class="page__footer">
    <span id="status-text"></span>
  </footer>

  <script src="current-orders.js"></script>
</body>
</html>
