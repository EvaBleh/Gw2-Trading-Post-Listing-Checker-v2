<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>TP Raw Transaction History</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="page">
  <header class="page__header flex-between">
    <h2>Raw Transaction History</h2>
    <div class="history__actions">
      <button class="btn btn--secondary btn--sm" id="btn-import">Import JSON</button>
      <button class="btn btn--secondary btn--sm" id="btn-refresh">↺&ensp;Refresh</button>
    </div>
  </header>

  <main class="raw-history__body">
    <pre class="raw-history__data" id="raw-history-data">Loading raw transaction history…</pre>
  </main>

  <footer class="page__footer">
    <span id="status-text"></span>
    <span class="history__sync-progress" id="history-progress" aria-live="polite" hidden></span>
  </footer>

  <script src="raw-transaction-history.js"></script>
</body>
</html>
